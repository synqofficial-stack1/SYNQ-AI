project_id = "jjdrlgwpvxyxeruyygli"

[functions.call-number]
verify_jwt = true

[functions.call-report]
verify_jwt = true

[functions.call-result]
verify_jwt = false

[functions.run-task]
# Supabase checks the caller's session token before the function runs, so an
# unauthenticated request never reaches our code.
verify_jwt = true

[functions.social-auth]
# OAuth callbacks come from the providers without a Supabase JWT; POST actions
# verify the signed-in user's JWT in the function before they can do anything.
verify_jwt = false

[functions.social-post]
verify_jwt = true

[functions.generate-image]
verify_jwt = true

# Vapi cannot send a Supabase user JWT. The function validates its own
# Authorization bearer credential before processing any webhook payload.
[functions.vapi-call-result]
verify_jwt = false

[functions.gmail-auth]
# OAuth callback has no app session. POST actions validate the user explicitly.
verify_jwt = false

[functions.email-outreach]
verify_jwt = true

[functions.email-worker]
# Scheduled calls use an independent server-only secret, checked in the handler.
verify_jwt = false
